# Model registry for the batch service.
#
# Each model runs as a separate `vllm serve` subprocess, so ALL vLLM features
# are supported natively: tool calling, reasoning, vision, quantization, etc.
#
# Global settings:
#   models_dir             – base directory for HuggingFace model files
#   idle_timeout_seconds   – unload after this many seconds of inactivity
#   max_batch_size         – max requests per /v1/batch call
#
# Per-model fields:
#   path                   – HF repo ID or path relative to models_dir
#   tp                     – tensor parallelism (GPUs needed, default 1)
#   gpu_memory_utilization – fraction of GPU VRAM to reserve (default 0.40)
#                            Multiple models share one GPU: sum must be ≤ 0.90
#   max_model_len          – context length cap
#   max_num_seqs           – max concurrent sequences (batch throughput knob)
#   max_num_batched_tokens – max tokens per scheduler step (throughput knob)
#   dtype                  – data type: auto, float16, bfloat16 (default auto)
#
#   tool_parser            – enable tool/function calling
#                            values: hermes, llama3_json, pythonic, mistral,
#                                    jamba, deepseek_v3, qwen3, ...
#   reasoning_parser       – enable thinking/reasoning mode
#                            values: deepseek_r1, qwen3, ...
#   quantization           – quantization format
#                            values: awq, gptq, fp8, gguf, bitsandbytes,
#                                    experts_int8, marlin, ...
#   kv_cache_dtype         – KV cache data type (50% memory saving with fp8)
#                            values: auto, fp8, fp8_e4m3, fp8_e5m2
#   limit_mm_per_prompt    – vision/multimodal: max media per prompt
#                            e.g. {"image": 3}
#   attn_backend           – attention implementation
#                            values: FLASH_ATTN (default), FLASHMLA
#   trust_remote_code      – allow custom model code from HF (default false)
#   chat_template          – path to custom jinja chat template
#   extra_args             – additional vllm serve CLI args as a list

models_dir: "/data/models"
idle_timeout_seconds: 1800
max_batch_size: 128

models:
  # -------------------------------------------------------------------
  # Standard model with tool calling
  # -------------------------------------------------------------------
  llama3.1-8b-instruct:
    path: "meta-llama/Meta-Llama-3.1-8B-Instruct"
    tp: 1
    gpu_memory_utilization: 0.40
    max_model_len: 8192
    max_num_seqs: 512
    max_num_batched_tokens: 16384
    tool_parser: "llama3_json"

  # -------------------------------------------------------------------
  # Model with reasoning (thinking) + tool calling
  # -------------------------------------------------------------------
  qwen3-8b:
    path: "Qwen/Qwen3-8B"
    tp: 1
    gpu_memory_utilization: 0.40
    max_model_len: 4096
    max_num_seqs: 512
    max_num_batched_tokens: 16384
    tool_parser: "hermes"
    reasoning_parser: "qwen3"

  # -------------------------------------------------------------------
  # Quantized model (AWQ) — fits in much less VRAM
  #   8B model at AWQ Q4 ≈ ~5GB weights (vs ~16GB fp16)
  #   Set gpu_memory_utilization low to co-locate with other models
  # -------------------------------------------------------------------
  # llama3.1-8b-instruct-awq:
  #   path: "hugging-quants/Meta-Llama-3.1-8B-Instruct-AWQ-INT4"
  #   tp: 1
  #   gpu_memory_utilization: 0.25
  #   max_model_len: 8192
  #   quantization: "awq"
  #   tool_parser: "llama3_json"

  # -------------------------------------------------------------------
  # Quantized model (GGUF Q4_K_M)
  #   NOTE: GGUF support in vLLM is experimental and slower than AWQ/GPTQ.
  #   The path format for HF-hosted GGUF is "repo_id:quant_type".
  # -------------------------------------------------------------------
  # qwen3-8b-gguf:
  #   path: "unsloth/Qwen3-8B-GGUF:Q4_K_M"
  #   tp: 1
  #   gpu_memory_utilization: 0.25
  #   quantization: "gguf"

  # -------------------------------------------------------------------
  # FP8 KV cache — halves KV cache memory, doubles concurrent requests
  # -------------------------------------------------------------------
  # llama3.1-8b-fp8kv:
  #   path: "meta-llama/Meta-Llama-3.1-8B-Instruct"
  #   tp: 1
  #   gpu_memory_utilization: 0.40
  #   max_model_len: 16384
  #   kv_cache_dtype: "fp8"
  #   tool_parser: "llama3_json"

  # -------------------------------------------------------------------
